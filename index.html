<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 7 Placement Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2933; --muted:#5f6b76; --line:#e3ded4;
    --accent:#2f6fb3; --accent-ink:#ffffff; --accent-soft:#e6eef8;
    --good:#2e7d4f; --good-soft:#e5f4e9; --warn:#a05a00; --warn-soft:#fbefdc; --bad:#b3261e; --bad-soft:#fbe9e7;
    --a:#7a5cc7; --b:#c2672b; --c:#2f6fb3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
  main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:1.7rem;margin:.2em 0 .3em;font-weight:800}
  h2{font-size:1.3rem;margin:1.2em 0 .4em;font-weight:800}
  h3{font-size:1.05rem;margin:1em 0 .3em;font-weight:800}
  p{margin:.4em 0 .8em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .muted{color:var(--muted)}
  .small{font-size:.85rem}
  label{font-weight:700;display:block;margin:.2em 0 .35em}
  input[type=text]{font:inherit;font-size:1.1rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;width:100%;max-width:360px;background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  textarea{font:inherit;font-size:.85rem;width:100%;min-height:90px;padding:10px;border:2px solid var(--line);border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
  button:hover{filter:brightness(1.07)}
  button.secondary{background:var(--accent-soft);color:var(--accent)}
  button.ghost{background:transparent;color:var(--muted);padding:8px 10px;text-decoration:underline}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .badge{display:inline-block;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff}
  .badge.A{background:var(--a)} .badge.B{background:var(--b)} .badge.C{background:var(--c)}
  .progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden;flex:1}
  .progress > div{height:100%;background:var(--accent);transition:width .25s}
  .qtext{font-size:1.25rem;font-weight:600;margin:.2em 0 1em}
  .part{margin:0 0 18px}
  .choices{display:grid;gap:8px}
  .choice{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;background:#fff}
  .choice input{width:20px;height:20px;accent-color:var(--accent)}
  .choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .prefix{display:flex;align-items:center;gap:8px}
  .prefix span{font-weight:800;font-size:1.1rem}
  table{border-collapse:collapse;width:100%;font-size:.92rem}
  th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
  th{font-weight:800;background:#faf8f3}
  .mini{width:auto;margin:6px 0 10px;font-size:1rem}
  .mini td,.mini th{border:1px solid var(--line);text-align:center;padding:4px 12px}
  .pill{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:999px}
  .pill.good{background:var(--good-soft);color:var(--good)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .pill.na{background:#eee;color:#666}
  .placement{border-radius:14px;padding:18px 20px;background:var(--accent-soft);border:2px solid var(--accent);margin:12px 0 6px}
  .placement .big{font-size:1.5rem;font-weight:800}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
  .stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
  .stat .n{font-size:1.5rem;font-weight:800}
  .note{background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.95rem}
  .ok{background:var(--good-soft);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.95rem}
  .err{color:var(--bad);font-weight:700;min-height:1.4em}
  ul{margin:.3em 0 .8em;padding-left:1.3em}
  /* calculator */
  .calc-toggle{position:fixed;right:18px;bottom:18px;z-index:5}
  .calc{position:fixed;right:18px;bottom:76px;width:250px;background:#22303c;border-radius:16px;padding:12px;z-index:6;box-shadow:0 8px 28px rgba(0,0,0,.25)}
  .calc .disp{background:#e8efe6;color:#111;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;text-align:right;padding:10px;border-radius:8px;margin-bottom:10px;min-height:2.2em;overflow:hidden;white-space:nowrap}
  .calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .calc .keys button{padding:10px 0;background:#3b4b59;color:#fff;font-size:1.05rem;border-radius:8px}
  .calc .keys button.op{background:#5a7896}
  .calc .keys button.eq{background:var(--accent)}
  .hidden{display:none !important}
  .tablewrap{overflow-x:auto}
  .qdetail td:nth-child(3), .qdetail td:nth-child(4){font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
</style>
</head>

/* ============ Math parsing (no eval) ============ */
function norm(s){return String(s==null?'':s).replace(/[−–—]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/');}
function parseNum(raw){
  let s = norm(raw).replace(/…|\.{2,}/g,'').replace(/[$%°]/g,'').replace(/,/g,'').replace(/[a-zA-Z³²]+/g,' ').replace(/^\s*=\s*/,'').replace(/\s+/g,' ').trim();
  s = s.replace(/^=\s*/,'');
  let m;
  if((m = s.match(/^(-)?\s*(\d+) (\d+)\s*\/\s*(\d+)$/))){const v=+m[2]+(+m[3])/(+m[4]); return m[1]?-v:v;}
  if((m = s.match(/^(-?\s*\d*\.?\d+)\s*\/\s*(-?\s*\d*\.?\d+)$/))){const b=parseFloat(m[2].replace(/\s/g,'')); if(b===0) return null; return parseFloat(m[1].replace(/\s/g,''))/b;}
  if(/^-?\s*(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s.replace(/\s/g,''));
  return null;
}
// tiny recursive-descent parser for + - * / ( ) numbers and x
function evalExpr(src, x){
  let s = src, i = 0;
  const peek = () => s[i];
  function num(){ let j=i; while(i<s.length && /[0-9.]/.test(s[i])) i++; if(j===i) throw 0; const v=parseFloat(s.slice(j,i)); if(isNaN(v)) throw 0; return v; }
  function factor(){
    const c = peek();
    if(c==='-'){i++; return -factor();}
    if(c==='+'){i++; return factor();}
    if(c==='('){i++; const v=expr(); if(peek()!==')') throw 0; i++; return v;}
    if(c==='x'){ if(x===undefined) throw 0; i++; return x; }
    return num();
  }
  function term(){ let v=factor(); while(peek()==='*'||peek()==='/'){ const o=s[i++]; const r=factor(); v = o==='*'? v*r : v/r; } return v; }
  function expr(){ let v=term(); while(peek()==='+'||peek()==='-'){ const o=s[i++]; const r=term(); v = o==='+'? v+r : v-r; } return v; }
  const v = expr(); if(i!==s.length) throw 0; return v;
}
function cleanExpr(raw){
  let e = norm(raw).toLowerCase().replace(/\s+/g,'').replace(/^y=/,'');
  if(!/^[0-9x+\-*/().]+$/.test(e)) return null;
  return e;
}
function implicitMul(e){ return e.replace(/([0-9x)])(?=[x(])/g,'$1*'); }
function checkExpr(p, raw){
  const e = cleanExpr(raw); if(!e) return false;
  if(p.noParens && /[()]/.test(e)) return false;
  if(p.factor){ const m = e.match(/^(\d+)\*?\((.+)\)$/); if(!m || +m[1]!==p.factor) return false; }
  const js = implicitMul(e);
  try{ for(const x of [1.7,-2.3,3.1,0.5]){ const v=evalExpr(js,x); if(!isFinite(v) || Math.abs(v-p.f(x))>1e-6) return false; } return true; }
  catch(_){ return false; }
}
function parseIneq(raw){
  let s = norm(raw).toLowerCase().replace(/≥|=>/g,'>=').replace(/≤|=</g,'<=').replace(/\s+/g,'').replace(/\$/g,'');
  let m = s.match(/^([a-z])(<=|>=|<|>)(.+)$/);
  if(m) return {op:m[2], v:parseNum(m[3])};
  m = s.match(/^(.+?)(<=|>=|<|>)([a-z])$/);
  if(m){ const flip={'<':'>','>':'<','<=':'>=','>=':'<='}; return {op:flip[m[2]], v:parseNum(m[1])}; }
  return null;
}
function gradePart(p, raw){
  if(raw==null || String(raw).trim()==='') return false;
  switch(p.t){
    case 'num': { const v=parseNum(raw); return v!==null && Math.abs(v-p.a) <= (p.tol ?? 1e-6); }
    case 'choice': return Number(raw)===p.a;
    case 'expr': return checkExpr(p, raw);
    case 'ineq': { const r=parseIneq(raw); return !!r && r.v!==null && r.op===p.op && Math.abs(r.v-p.v)<1e-6; }
    case 'list': { const vals = norm(raw).split(/[,;]+|\s+/).filter(Boolean).map(parseNum); return vals.length===p.a.length && vals.every((v,k)=>v!==null && Math.abs(v-p.a[k])<1e-9); }
    case 'ratio': { const s = norm(raw).toLowerCase().replace(/\s*to\s*/,':').replace('/',':').replace(/\s+/g,''); const m=s.match(/^(\d+):(\d+)$/); return !!m && +m[1]===p.a[0] && +m[2]===p.a[1]; }
  }
  return false;
}
function correctText(p){
  if(p.show) return p.show;
  if(p.t==='choice') return p.opts[p.a];
  if(p.t==='num') return String(p.a);
  return '';
}
function studentText(p, raw){
  if(raw==null || String(raw).trim()==='') return '—';
  if(p.t==='choice') return p.opts[Number(raw)] ?? '—';
  return String(raw);
}

/* ============ Scoring and placement ============ */
function scoreRecord(rec){
  const res = {byQ:{}, totals:{A:0,B:0,C:0}, attempted:{A:0,B:0,C:0}};
  for(const q of QUESTIONS){
    const ans = rec.answers[q.id];
    const attempted = ans !== undefined;
    const partsOk = q.parts.map((p,k)=> attempted ? gradePart(p, ans[k]) : false);
    const nOk = partsOk.filter(Boolean).length;
    let pts = 0;
    if(nOk===q.parts.length) pts = 1; else if(q.parts.length>1 && nOk >= q.parts.length/2) pts = 0.5;
    res.byQ[q.id] = {attempted, partsOk, pts};
    res.totals[q.part] += pts;
    if(attempted) res.attempted[q.part]++;
  }
  const {A,B,C} = res.totals;
  let level, start, detail;
  if(A < PASS.A){ level='Grade 5 level'; start='Bridge Week F1'; detail='Start with Bridge Weeks F1–F4 (Grade 5), then G1–G5 (Grade 6), then Math 7 Week 1.'; }
  else if(B < PASS.B){ level='Grade 6 level'; start='Bridge Week G1'; detail='Start with Bridge Weeks G1–G5 (Grade 6), then Math 7 Week 1.'; }
  else if(C >= C_ADV){ level='Ready for Grade 8 content'; start='Review missed topics'; detail='Review any topics marked "Teach full week" below, then preview Math 8: slope, linear functions and systems.'; }
  else if(C >= C_STRONG){ level='Grade 7, strong'; start='First week marked "Teach full week"'; detail='Teach only the weeks marked "Teach full week" below; give the others as one-session checks.'; }
  else { level='Grade 7 level (on grade)'; start='Week 1'; detail='Start Math 7 at Week 1. Shorten the weeks marked "Shorten" to one session.'; }
  // week status from Part C
  const weeks = {};
  for(let w=1; w<=18; w++) weeks[w] = {tested:false, ok:true};
  for(const q of QUESTIONS.filter(q=>q.part==='C')){
    const r = res.byQ[q.id];
    q.parts.forEach((p,k)=>{ if(!p.w) return; const W=weeks[p.w]; if(r.attempted){ W.tested=true; if(!r.partsOk[k]) W.ok=false; } else { W.ok=false; } });
  }
  const firstTeach = Object.keys(weeks).map(Number).find(w=>!(weeks[w].tested && weeks[w].ok));
  if(level.startsWith('Grade 7') && firstTeach) start = 'Week '+firstTeach+' ('+WEEKS[firstTeach]+')';
  if(level.startsWith('Grade 7, strong') && !firstTeach) start='All weeks shortened';
  // flags
  const flags = [];
  const anyWrong = ids => ids.some(id => res.byQ[id].pts < 1);
  if(anyWrong(['C7','C8','C9']) && res.attempted.C>0) flags.push('Signs with negative numbers (C7–C9): plan extra time in Weeks 6–8.');
  if(anyWrong(['A4','A5','A6','A7','B1'])) flags.push('Fractions (A4–A7, B1): fractions may be a root gap. Use Bridge Week F2 even if he passed Part A.');
  if(rec.stoppedPart) flags.push('The test stopped early in Part '+rec.stoppedPart+' after '+STOP_AFTER+' misses in a row. Questions after that were not given and count as 0.');
  return Object.assign(res, {level, start, detail, weeks, flags});
}

/* ============ Results code (to send to the tutor) ============ */
function encodeRecord(rec){
  const compact = {v:1,n:rec.name,d:rec.date,s:rec.startedAt,e:rec.endedAt,sp:rec.stoppedPart||null,a:rec.answers};
  return 'M7P-' + btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
}
function decodeRecord(code){
  const s = String(code||'').trim().replace(/^M7P-/,'').replace(/\s+/g,'');
  const o = JSON.parse(decodeURIComponent(escape(atob(s))));
  if(!o || o.v!==1 || typeof o.a!=='object') throw new Error('bad');
  return {name:String(o.n||''),date:String(o.d||''),startedAt:o.s,endedAt:o.e,stoppedPart:o.sp||null,answers:o.a};
}

/* ============ State ============ */
const LS_KEY = 'm7p_state_v1';
let state = null; // {name,date,startedAt,idx,answers,streak,stoppedPart,phase:'intro'|'q'|'done', introPart}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(_){} }
function load(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(_){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(LS_KEY); }catch(_){} }

/* ============ Platform capabilities (optional) ============ */
let DB = null, USER = null, isOwner = false;
(async ()=>{
  try{ if(window.claude && claude.use){ USER = await claude.use('user'); isOwner = !!(USER && USER.isOwner && await USER.isOwner()); DB = await claude.use('db'); } }catch(_){ DB=null; }
  if(currentView==='start') render();
})();
async function saveToDb(rec, sc){
  if(!DB) return false;
  try{
    await DB.collection('results').add({
      name: rec.name, date: rec.date, finishedAt: rec.endedAt || new Date().toISOString(),
      scoreA: sc.totals.A, scoreB: sc.totals.B, scoreC: sc.totals.C, placement: sc.level, code: encodeRecord(rec)
    });
    return true;
  }catch(_){ return false; }
}

/* ============ Rendering helpers ============ */
const app = document.getElementById('app');
let currentView = 'start';
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(html){ app.innerHTML = html; window.scrollTo(0,0); }
function showCalc(on){ document.getElementById('calcToggle').classList.toggle('hidden', !on); if(!on) document.getElementById('calc').classList.add('hidden'); }

/* ---------- Start ---------- */
function renderStart(){
  currentView='start'; showCalc(false);
  const saved = load();
  const resume = saved && saved.phase && saved.phase!=='done' ? saved : null;
  el(`
  <div class="card">
    <h1>Math 7 Placement Test</h1>
    <p>This test helps your tutor find the right place to start. It has three parts and 46 questions, and takes about 75 minutes. You can take a break between parts.</p>
    <ul>
      <li>Answer one question at a time. You will not see if you were right. Your tutor gets the results.</li>
      <li>Use scratch paper. Type fractions with a slash, like <b>3/4</b>, and mixed numbers with a space, like <b>2 1/2</b>.</li>
      <li>If you have not learned something yet, choose <b>I don't know yet</b>. That is okay.</li>
    </ul>
    ${resume ? `<div class="ok">A test for <b>${esc(resume.name)}</b> is in progress on this computer.</div>
      <div class="row"><button id="resumeBtn">Resume test</button><button class="secondary" id="restartBtn">Start a new test</button></div>`
    : `<label for="nm">Your first and last name</label>
      <input type="text" id="nm" autocomplete="name" maxlength="60">
      <div class="err" id="err"></div>
      <button id="startBtn">Start the test</button>`}
  </div>
  <p class="row" style="margin-top:14px"><span class="spacer"></span><button class="ghost" id="tutorBtn">Tutor: view results</button></p>`);
  if(resume){
    document.getElementById('resumeBtn').onclick = ()=>{ state=resume; route(); };
    document.getElementById('restartBtn').onclick = ()=>{ clearSaved(); renderStart(); };
  } else {
    const go = ()=>{
      const name = document.getElementById('nm').value.trim();
      if(!name){ document.getElementById('err').textContent='Please type your name to begin.'; return; }
      state = {name, date:new Date().toLocaleDateString(), startedAt:new Date().toISOString(), idx:0, answers:{}, streak:0, stoppedPart:null, phase:'intro', introPart:'A'};
      save(); route();
    };
    document.getElementById('startBtn').onclick = go;
    document.getElementById('nm').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    document.getElementById('nm').focus();
  }
  document.getElementById('tutorBtn').onclick = ()=> isOwner ? renderTutorHome() : renderPin(()=>renderTutorHome());
}

function route(){
  if(state.phase==='intro') return renderPartIntro(state.introPart);
  if(state.phase==='q') return renderQuestion();
  if(state.phase==='done') return renderDone();
}

/* ---------- Part intro ---------- */
function renderPartIntro(part){
  currentView='test'; showCalc(false);
  const info = PART_INFO[part];
  el(`<div class="card">
    <span class="badge ${part}">Part ${part}</span>
    <h1>${info.name}</h1>
    <p>${info.intro}</p>
    <button id="goBtn">Begin Part ${part}</button>
  </div>`);
  document.getElementById('goBtn').onclick = ()=>{ state.phase='q'; state.streak=0; save(); renderQuestion(); };
}

/* ---------- Question ---------- */
function renderQuestion(){
  currentView='test';
  const q = QUESTIONS[state.idx];
  showCalc(PART_INFO[q.part].calc);
  const n = state.idx+1, total = QUESTIONS.length;
  const prev = state.answers[q.id] || [];
  const partsHtml = q.parts.map((p,k)=>{
    const id = 'p'+k;
    const label = p.label ? `<label for="${id}">${p.label}</label>` : '';
    if(p.t==='choice'){
      return `<div class="part"><label>${p.label||'Choose one:'}</label><div class="choices">`+
        p.opts.map((o,j)=>`<label class="choice"><input type="radio" name="${id}" value="${j}" ${String(prev[k])===String(j)?'checked':''}> ${esc(o)}</label>`).join('')+`</div></div>`;
    }
    const input = `<input type="text" id="${id}" autocomplete="off" inputmode="text" value="${esc(prev[k]??'')}">`;
    return `<div class="part">${label}${p.prefix?`<div class="prefix"><span>${p.prefix}</span>${input}</div>`:input}${p.hint?`<div class="muted small">${p.hint}</div>`:''}</div>`;
  }).join('');
  el(`<div class="topbar"><span class="badge ${q.part}">Part ${q.part}</span><div class="progress"><div style="width:${(state.idx/total*100).toFixed(1)}%"></div></div><span class="muted small">${n} of ${total}</span></div>
  <div class="card">
    <div class="muted small">Question ${q.id}</div>
    <div class="qtext">${q.text}</div>
    ${partsHtml}
    <div class="err" id="err"></div>
    <div class="row"><button id="nextBtn">${state.idx===total-1?'Finish':'Next'}</button><span class="spacer"></span><button class="secondary" id="skipBtn">I don't know yet</button></div>
  </div>
  <p class="muted small" style="margin-top:12px">Your answers are saved as you go. If the page closes, open it again and choose Resume.</p>`);
  const first = app.querySelector('input[type=text]'); if(first) first.focus();
  app.querySelectorAll('input[type=text]').forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(false); }));
  document.getElementById('nextBtn').onclick = ()=>submit(false);
  document.getElementById('skipBtn').onclick = ()=>submit(true);

  function submit(skip){
    const vals = q.parts.map((p,k)=>{
      if(skip) return '';
      if(p.t==='choice'){ const c = app.querySelector(`input[name=p${k}]:checked`); return c?c.value:''; }
      return document.getElementById('p'+k).value.trim();
    });
    if(!skip && vals.every(v=>v==='')){ document.getElementById('err').textContent='Type an answer, or choose "I don\'t know yet."'; return; }
    if(!skip && vals.some(v=>v==='')){
      const e = document.getElementById('err');
      if(!e.dataset.warned){ e.textContent='One part is still blank. Press the button again to go on anyway.'; e.dataset.warned='1'; return; }
    }
    state.answers[q.id] = vals;
    // stop rule
    const ok = q.parts.map((p,k)=>gradePart(p, vals[k])).filter(Boolean).length;
    const pts = ok===q.parts.length ? 1 : (q.parts.length>1 && ok>=q.parts.length/2 ? 0.5 : 0);
    state.streak = pts===0 ? state.streak+1 : 0;
    if(state.streak >= STOP_AFTER){ state.stoppedPart = q.part; return finish(); }
    state.idx++;
    if(state.idx >= QUESTIONS.length) return finish();
    const nextPart = QUESTIONS[state.idx].part;
    if(nextPart !== q.part){ state.phase='intro'; state.introPart=nextPart; save(); return renderPartIntro(nextPart); }
    save(); renderQuestion();
  }
}

async function finish(){
  state.phase='done'; state.endedAt=new Date().toISOString(); save();
  renderDone();
  const sc = scoreRecord(state);
  if(!state.savedToDb && DB){ const ok = await saveToDb(state, sc); if(ok){ state.savedToDb = true; save(); if(currentView==='done') renderDone(); } }
}

  document.getElementById('copyBtn').onclick = async ()=>{

let unsubResults = null, savedResults = null, resultsNote = '';
function renderTutorHome(){

function renderSavedList(){

/* ---------- Report ---------- */
function pill(pts, attempted){
  if(!attempted) return '<span class="pill na">Not given</span>';
  if(pts===1) return '<span class="pill good">1</span>';
  if(pts===0.5) return '<span class="pill warn">0.5</span>';
  return '<span class="pill bad">0</span>';
}
function renderReport(rec, onBack){
  currentView='report'; showCalc(false);
  const sc = scoreRecord(rec);
  const mins = rec.startedAt && rec.endedAt ? Math.round((new Date(rec.endedAt)-new Date(rec.startedAt))/60000) : null;
  const passed = (p)=> p==='C' ? (sc.totals.C>=C_STRONG?'Strong':'—') : (sc.totals[p]>=PASS[p]?'Passed':'Not passed');
  const weekRows = Object.keys(WEEKS).map(Number).map(w=>{
    const W = sc.weeks[w]; let s;
    if(!W.tested) s='<span class="pill na">Not tested — teach</span>';
    else if(W.ok) s='<span class="pill good">Shorten to 1 session</span>';
    else s='<span class="pill bad">Teach full week</span>';
    return `<tr><td>Week ${w}</td><td>${WEEKS[w]}</td><td>${s}</td></tr>`;
  }).join('');
  const detailRows = QUESTIONS.map(q=>{
    const r = sc.byQ[q.id]; const ans = rec.answers[q.id] || [];
    const stu = q.parts.map((p,k)=> (q.parts.length>1?`(${String.fromCharCode(97+k)}) `:'') + esc(r.attempted?studentText(p, ans[k]):'—') + (r.attempted ? (r.partsOk[k]?' ✓':' ✗') : '')).join('<br>');
    const cor = q.parts.map((p,k)=> (q.parts.length>1?`(${String.fromCharCode(97+k)}) `:'') + esc(correctText(p))).join('<br>');
    const what = q.part==='C' ? `Topic ${q.topic} · ${q.std}` : esc(q.skill);
    return `<tr><td><b>${q.id}</b></td><td>${what}</td><td>${stu}</td><td>${cor}</td><td>${pill(r.pts, r.attempted)}</td></tr>`;
  }).join('');

  el(`<div class="card">
    <div class="row"><h1 style="margin:0">Placement report</h1><span class="spacer"></span><button class="secondary" id="backBtn">Back</button></div>
    <p class="muted">${esc(rec.name)} · ${esc(rec.date)}${mins!==null?` · ${mins} minutes`:''}</p>
    <div class="placement"><div class="muted small">Placement</div><div class="big">${sc.level}</div><div><b>Start at:</b> ${esc(sc.start)}</div><div>${sc.detail}</div></div>
    <div class="stats">
      <div class="stat"><div class="muted small">Part A · Grade 5</div><div class="n">${sc.totals.A} / 12</div><div class="small">Pass: ${PASS.A} · ${passed('A')}</div></div>
      <div class="stat"><div class="muted small">Part B · Grade 6</div><div class="n">${sc.totals.B} / 15</div><div class="small">Pass: ${PASS.B} · ${passed('B')}</div></div>
      <div class="stat"><div class="muted small">Part C · Grade 7</div><div class="n">${sc.totals.C} / 19</div><div class="small">Strong: ${C_STRONG}+ · Grade 8-ready: ${C_ADV}+</div></div>
    </div>
    ${sc.flags.length?`<h3>What to look for</h3><ul>${sc.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    <p class="muted small">It is mid-year, so missing most of Units 3 and 4 in Part C is normal and is not a reason to place below Grade 7.</p>
    <div class="row"><button id="copyRep">Copy report as text</button><span id="copied" class="muted"></span></div>

    <h2>Math 7 weeks: teach or shorten</h2>
    <p class="muted small">Based on the Part C question for each topic.</p>
    <div class="tablewrap"><table><tr><th>Week</th><th>Topic</th><th>Plan</th></tr>${weekRows}</table></div>

    <h2>Every question</h2>
    <div class="tablewrap"><table class="qdetail"><tr><th>#</th><th>Skill / Topic</th><th>Student answer</th><th>Correct answer</th><th>Points</th></tr>${detailRows}</table></div>
  </div>`);
  document.getElementById('backBtn').onclick = onBack || renderStart;
  document.getElementById('copyRep').onclick = async ()=>{
    const txt = reportText(rec, sc, mins);
    try{ await navigator.clipboard.writeText(txt); document.getElementById('copied').textContent='Copied!'; }
    catch(_){ document.getElementById('copied').textContent='Copy is blocked here. Select the text on the page instead.'; }
  };
}
function reportText(rec, sc, mins){
  const L = [];
  L.push('Math 7 Placement Report');
  L.push(`${rec.name} · ${rec.date}${mins!==null?` · ${mins} minutes`:''}`);
  L.push('');
  L.push(`Placement: ${sc.level}`);
  L.push(`Start at: ${sc.start}`);
  L.push(sc.detail);
  L.push('');
  L.push(`Part A (Grade 5): ${sc.totals.A}/12 (pass ${PASS.A})`);
  L.push(`Part B (Grade 6): ${sc.totals.B}/15 (pass ${PASS.B})`);
  L.push(`Part C (Grade 7): ${sc.totals.C}/19 (strong ${C_STRONG}+, Grade 8-ready ${C_ADV}+)`);
  if(sc.flags.length){ L.push(''); L.push('What to look for:'); sc.flags.forEach(f=>L.push('- '+f)); }
  L.push(''); L.push('Math 7 weeks:');
  Object.keys(WEEKS).map(Number).forEach(w=>{ const W=sc.weeks[w]; L.push(`Week ${w} ${WEEKS[w]}: ${!W.tested?'Not tested - teach':W.ok?'Shorten to 1 session':'Teach full week'}`); });
  L.push(''); L.push('Missed or partial questions:');
  QUESTIONS.forEach(q=>{ const r=sc.byQ[q.id]; if(r.pts<1){ const ans=rec.answers[q.id]||[]; L.push(`${q.id}: ${r.attempted?q.parts.map((p,k)=>studentText(p,ans[k])).join(' | '):'not given'}  (correct: ${q.parts.map(correctText).join(' | ')})`); } });
  return L.join('\n');
}

function render(){ if(currentView==='start') renderStart(); }

/* ============ Calculator ============ */
(function(){
  const keys = ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+','C','±','√','%'];
  const box = document.getElementById('calcKeys'), disp = document.getElementById('calcDisp');
  let expr = '';
  const show = v => { disp.textContent = v===''?'0':v; };
  function evaluate(){ try{ const v = evalExpr(norm(expr).replace(/\s+/g,'')); if(!isFinite(v)) return 'Error'; return String(+v.toFixed(10)); }catch(_){ return 'Error'; } }
  keys.forEach(k=>{
    const b = document.createElement('button'); b.type='button'; b.textContent=k;
    if('÷×−+'.includes(k)) b.className='op'; if(k==='=') b.className='eq';
    b.onclick = ()=>{
      if(k==='C'){ expr=''; }
      else if(k==='='){ expr = evaluate(); if(expr==='Error'){ show('Error'); expr=''; return; } }
      else if(k==='√'){ const v=evaluate(); if(v==='Error'||+v<0){ show('Error'); expr=''; return; } expr=String(+Math.sqrt(+v).toFixed(10)); }
      else if(k==='%'){ const v=evaluate(); if(v==='Error'){ show('Error'); expr=''; return; } expr=String(+(+v/100).toFixed(10)); }
      else if(k==='±'){ const v=evaluate(); if(v==='Error'){ return; } expr=String(-(+v)); }
      else { expr += k; }
      show(expr);
    };
    box.appendChild(b);
  });
  document.getElementById('calcToggle').onclick = ()=> document.getElementById('calc').classList.toggle('hidden');
})();

renderStart();
</script>
